<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦖 Emojisaurus.me - Emoji 17.0 Explorer</title>
<style>
:root{
  --bg:#0b0d10; --panel:#111419; --panel2:#151a21; --line:#20262f;
  --ink:#e6ebf2; --dim:#8b95a4; --dimmer:#5d6674;
  --accent:#5eead4; --accent2:#38bdf8; --warn:#fbbf24; --hot:#fb7185;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.5 var(--ui);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
/* The app owns its own box rather than trusting body's flex flow. An embedding
   host can inject its own children into <body> — the publish wrapper injects
   two 154px iframes — and those would otherwise squeeze the layout. */
#shell{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--line);background:var(--panel);
  padding:14px 20px 0;flex:0 0 auto;
}
.brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font:600 15px/1 var(--ui);margin:0;letter-spacing:-.01em}
h1 .v{color:var(--accent);font-family:var(--mono)}
#meta{color:var(--dim);font-size:11.5px;font-family:var(--mono)}

.searchrow{display:flex;gap:10px;margin:12px 0 0;align-items:center;flex-wrap:wrap}
.qwrap{position:relative;flex:1 1 420px;min-width:280px}
#q{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px/1 var(--mono);padding:11px 12px 11px 34px;outline:none;
}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,234,212,.10)}
#q::placeholder{color:var(--dimmer)}
.qicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dimmer);font-size:13px;pointer-events:none}
.slash{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--dimmer);font:10px/1 var(--mono);border:1px solid var(--line);border-radius:4px;padding:3px 5px}

.toggles{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
label.tg{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;cursor:pointer;user-select:none;white-space:nowrap}
label.tg:hover{color:var(--ink)}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
select{
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;font:11.5px/1 var(--mono);cursor:pointer;outline:none;
}
select:focus{border-color:var(--accent)}

#fieldref{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 0}
.fieldchip{
  background:transparent;border:1px solid var(--line);color:var(--dim);
  font:10.5px/1 var(--mono);padding:4px 7px;border-radius:5px;cursor:pointer;
}
.fieldchip:hover{border-color:var(--accent2);color:var(--accent2)}

#examples{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ex{
  display:flex;align-items:center;gap:7px;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;text-align:left;
}
.ex:hover{border-color:var(--accent);background:#182028}
.ex code{font:11px/1 var(--mono);color:var(--accent)}
.ex span{font-size:11px;color:var(--dim)}

/* ---------- layout ---------- */
main{flex:1 1 auto;display:flex;min-height:0}
#left{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
#detail{
  flex:0 0 380px;border-left:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:18px 18px 60px;
}

#status{
  padding:8px 20px;border-bottom:1px solid var(--line);color:var(--dim);
  font:11.5px/1.4 var(--mono);display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:0 0 auto;
}
#status strong{color:var(--accent);font-weight:600}
.dot{color:var(--dimmer)}
.fuzzy{color:var(--warn)}
.muted-i{color:var(--dimmer);font-style:italic}

/* ---------- table ---------- */
.thead,.row{
  display:grid;
  grid-template-columns:46px 52px minmax(200px,2.2fr) minmax(110px,1fr) 52px 92px 56px 60px minmax(150px,1.3fr);
  align-items:center;gap:0;
}
.thead{
  padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel2);
  font:10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  height:34px;flex:0 0 auto;
}
.thead>div{cursor:pointer;user-select:none;padding:0 6px;white-space:nowrap;overflow:hidden}
.thead>div:hover{color:var(--accent)}
.thead>div.asc::after{content:" ▲";font-size:8px;color:var(--accent)}
.thead>div.desc::after{content:" ▼";font-size:8px;color:var(--accent)}

#viewport{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}
#spacer{position:relative;width:100%}
#rows{position:absolute;top:0;left:0;right:0;will-change:transform}

.row{
  padding:0 20px;border-bottom:1px solid #171c23;cursor:pointer;
}
.row:hover{background:#141a21}
.row.sel{background:#16222a;box-shadow:inset 3px 0 0 var(--accent)}
.row>div{padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.c-idx{color:var(--dimmer);font:10.5px/1 var(--mono);text-align:right}
.c-emoji{text-align:center}
.glyph{font-family:var(--emoji);font-size:21px;line-height:1}
.c-name{display:flex;align-items:center;gap:7px;min-width:0}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt-badge{
  flex:0 0 auto;font:9.5px/1 var(--mono);color:#0b0d10;background:var(--accent);
  padding:3px 5px;border-radius:4px;max-width:130px;overflow:hidden;text-overflow:ellipsis;
}
.tone-badge{flex:0 0 auto;font:9.5px/1 var(--mono);color:var(--dim);border:1px solid var(--line);padding:2px 4px;border-radius:4px}
.c-group{color:var(--dim);font:11px/1 var(--mono)}
.c-num{font:11.5px/1 var(--mono);text-align:right;color:var(--ink)}
.c-ver{font:11px/1 var(--mono);color:var(--dim);text-align:right}
.c-cp{font:10.5px/1 var(--mono);color:var(--dimmer)}
.bytes{position:relative}
.bnum{position:relative;z-index:1}
.bbar{
  position:absolute;right:6px;bottom:5px;height:2px;background:var(--accent2);
  opacity:.5;border-radius:1px;
}

/* ---------- detail ---------- */
#detail .empty{color:var(--dimmer);font-size:12px;padding-top:40px;text-align:center;line-height:1.7}
.d-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.d-glyph{font-family:var(--emoji);font-size:46px;line-height:1;flex:0 0 auto}
.d-ht{min-width:0}
.d-name{font:600 15px/1.3 var(--ui);word-break:break-word}
.d-sub{color:var(--dim);font:11px/1.5 var(--mono);margin-top:2px}
.d-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chip{font:10px/1 var(--mono);border:1px solid var(--line);color:var(--dim);padding:3px 6px;border-radius:4px}

.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}
.sz{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 6px;text-align:center}
.szn{font:600 17px/1 var(--mono);color:var(--accent)}
.szl{font-size:9.5px;color:var(--dim);margin-top:4px;line-height:1.3}

#detail h3{
  font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line);
}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:5px}
.kv .k{font-size:10.5px;color:var(--dim)}
.kv .v{
  display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:5px;padding:5px 6px;font:10.5px/1.4 var(--mono);min-width:0;
}
.kv .v>span:first-child{flex:1 1 auto;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.kv .v>span:first-child::-webkit-scrollbar{display:none}
.copy{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);
  font:9.5px/1 var(--mono);padding:3px 5px;border-radius:4px;cursor:pointer;
}
.copy:hover{border-color:var(--accent);color:var(--accent)}

.bytegrid{display:flex;gap:4px;flex-wrap:wrap}
.byte{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 6px;text-align:center}
.bh{font:600 11px/1 var(--mono);color:var(--accent2)}
.bb{font:8.5px/1 var(--mono);color:var(--dimmer);margin-top:3px;letter-spacing:.02em}

.sense{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:7px}
.sense-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.sense-name{font:600 12px/1.3 var(--ui)}
.reg{font:9.5px/1 var(--mono);padding:3px 5px;border-radius:4px;background:#1e2733;color:var(--accent2)}
.reg-sexual,.reg-substances{background:#3a1d25;color:var(--hot)}
.reg-irony,.reg-internet{background:#1e2f2b;color:var(--accent)}
.reg-finance{background:#33301a;color:var(--warn)}
.reg-regional,.reg-misread{background:#2a2436;color:#c4b5fd}
.conf{font:9px/1 var(--mono);padding:2px 4px;border-radius:3px;border:1px solid var(--line);color:var(--dimmer)}
.conf-high{color:var(--accent);border-color:#1d4d44}
.combo{font:9.5px/1 var(--mono);color:var(--dim)}
.gloss{font-size:11.5px;line-height:1.6;color:#c3ccd8}

.kws{display:flex;gap:4px;flex-wrap:wrap}
.kw{
  background:transparent;border:1px solid var(--line);color:var(--dim);
  font:10.5px/1 var(--mono);padding:4px 7px;border-radius:5px;cursor:pointer;
}
.kw:hover{border-color:var(--accent);color:var(--accent)}
.family{display:flex;gap:5px;flex-wrap:wrap}
.famitem{
  display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;cursor:pointer;color:var(--ink);
}
.famitem:hover{border-color:var(--accent)}
.famglyph{font-family:var(--emoji);font-size:17px;line-height:1}
.famlabel{font:10px/1 var(--mono);color:var(--dim)}
.muted{color:var(--dim);font-size:11.5px;line-height:1.6}
.gated{background:#241c15;border:1px solid #4a3a22;border-radius:6px;padding:9px 10px}
.linkbtn{background:none;border:none;color:var(--warn);font:inherit;text-decoration:underline;cursor:pointer;padding:0}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#252c36;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#333c48}

/* ---------- about link ---------- */
#aboutBtn{
  background:transparent;border:1px solid var(--line);color:var(--dim);
  font:11px/1 var(--mono);padding:5px 9px;border-radius:5px;cursor:pointer;flex:0 0 auto;
  text-decoration:none;white-space:nowrap;
}
#aboutBtn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- desktop-only affordances, hidden by default on mobile ---------- */
#helpToggle{display:none}
#msort{display:none}
#sheetClose{display:none}
#scrim{display:none}
#scrim[hidden]{display:none!important}

/* ---------- narrow desktop / tablet ---------- */
@media (max-width:1000px) and (min-width:821px){
  #detail{flex:0 0 320px}
  .thead,.row{grid-template-columns:36px 46px minmax(140px,2fr) 52px 80px 56px}
  .c-group,.c-cp,.thead>div:nth-child(4),.thead>div:nth-child(9),.row>.c-ver,.thead>div:nth-child(8){display:none}
}

/* ---------- mobile ----------------------------------------------------------
   The desktop layout is a fixed three-pane app shell, which cannot survive a
   phone: the header alone took 67% of the screen and the table collapsed to
   zero height. Mobile gets a different shape entirely — a scrolling card list
   with a bottom-sheet detail view — while every row still comes from the same
   engine and the same virtualiser.
---------------------------------------------------------------------------- */
@media (max-width:820px){
  html{-webkit-text-size-adjust:100%}
  /* dvh, not vh: the mobile URL bar changes vh mid-scroll and strands content. */
  body{height:100dvh}
  /* Pinned, so host-injected body children cannot take flow space from it. */
  #shell{position:fixed;inset:0;height:100dvh}

  header{padding:9px 14px 0}
  .brandrow{gap:8px;flex-wrap:nowrap;align-items:center}
  h1{font-size:14px;flex:0 0 auto}
  /* One line, ellipsised: this is informational and was wrapping to two. */
  #meta{font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  .searchrow{margin-top:8px;gap:8px}
  .qwrap{flex:1 1 100%}
  /* 16px exactly: anything smaller makes iOS Safari zoom the page on focus and
     the user then cannot get back out. */
  #q{font-size:16px;padding:12px 12px 12px 34px}
  .slash{display:none}

  /* One row, not three. Wrapping cost 98px of a 640px-tall screen. */
  .toggles{width:100%;gap:9px;flex-wrap:nowrap;align-items:center}
  label.tg{font-size:11.5px;min-height:42px;white-space:nowrap;flex:0 0 auto;gap:5px}
  select{min-height:42px;font-size:11.5px;flex:1 1 auto;min-width:0;padding:6px}

  /* Query help is 24 chips — genuinely useful on desktop, and the single
     biggest space thief on a phone. Collapsed behind a disclosure. */
  #helpToggle{
    display:block;width:100%;margin:10px 0 0;padding:11px 12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--dim);font:11.5px/1 var(--mono);text-align:left;cursor:pointer;
  }
  #helpToggle::after{content:" ▾";float:right}
  #helpToggle[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
  #helpToggle[aria-expanded="true"]::after{content:" ▴"}
  #queryhelp{display:none;padding-bottom:4px}
  /* Capped and self-scrolling: expanded, 24 chips would otherwise push the
     header to 741px of an 844px screen and bury the results again. */
  #queryhelp.open{display:block;max-height:38dvh;overflow-y:auto;overscroll-behavior:contain}
  #fieldref{margin-top:8px}
  .fieldchip,.kw{padding:9px 11px;font-size:12px}
  .ex{padding:9px 11px}
  #examples{margin-bottom:10px}

  main{flex-direction:column;position:relative}
  #left{flex:1 1 auto;min-height:0}

  #status{padding:7px 14px;font-size:11px}

  /* The column grid needs 430px minimum, which clipped 50px off every row on a
     390px screen. Cards replace it: no fixed columns, nothing to clip. */
  .thead{display:none}
  #msort{
    display:flex;align-items:center;gap:8px;padding:8px 14px;flex:0 0 auto;
    border-bottom:1px solid var(--line);background:var(--panel2);
  }
  #msort label{font:10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  #msort select{flex:1 1 auto;min-height:40px}
  #dirBtn{
    flex:0 0 auto;min-width:44px;min-height:40px;background:var(--bg);
    border:1px solid var(--line);border-radius:6px;color:var(--ink);
    font:13px/1 var(--mono);cursor:pointer;
  }
  #dirBtn:active{border-color:var(--accent);color:var(--accent)}

  #viewport{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  .row{
    display:flex;align-items:center;gap:12px;padding:0 14px;
    border-bottom:1px solid #171c23;
  }
  .row>div{padding:0}
  .c-idx,.c-group,.c-num,.c-ver,.c-cp{display:none}
  .c-emoji{flex:0 0 44px;text-align:center}
  .glyph{font-size:30px}
  .c-name{flex:1 1 auto;display:block;min-width:0}
  .nm{
    display:block;font-size:14px;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .m-meta{
    display:flex;gap:8px;margin-top:3px;font:10.5px/1.3 var(--mono);
    color:var(--dim);flex-wrap:wrap;align-items:center;
  }
  .m-meta b{color:var(--ink);font-weight:600}
  .alt-badge{max-width:none;font-size:10px;padding:3px 6px;margin-top:4px;display:inline-block}
  .tone-badge{font-size:10px;padding:3px 5px}
  .m-chev{flex:0 0 auto;color:var(--dimmer);font-size:16px}

  /* Detail becomes a bottom sheet. On desktop it is a side panel that is always
     visible; on a phone that would sit below the fold and read as broken. */
  #detail{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    height:min(82dvh,720px);max-height:82dvh;
    border-left:none;border-top:1px solid var(--accent);
    border-radius:14px 14px 0 0;
    padding:16px 16px calc(28px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 40px rgba(0,0,0,.6);
    transform:translateY(102%);transition:transform .22s ease-out;
    overscroll-behavior:contain;
  }
  #detail.open{transform:translateY(0)}
  #sheetClose{
    display:block;position:sticky;top:-16px;margin:-16px -16px 8px auto;
    width:52px;height:48px;background:var(--panel);border:none;
    border-bottom:1px solid var(--line);border-left:1px solid var(--line);
    border-radius:0 14px 0 10px;color:var(--dim);font-size:17px;cursor:pointer;z-index:2;
  }
  #scrim{
    display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .22s ease-out;
  }
  #scrim.open{opacity:1;pointer-events:auto}

  .sizes{grid-template-columns:repeat(2,1fr);gap:8px}
  .szn{font-size:19px}
  .szl{font-size:10.5px}
  .d-glyph{font-size:52px}
  .kv{grid-template-columns:1fr;gap:3px;margin-bottom:9px}
  .kv .k{font-size:11px}
  .kv .v{padding:9px 8px;font-size:11px}
  /* min-height, not just padding: pointer:coarse is not always reported, so
     the tap target must not depend on it being detected. */
  .copy{padding:7px 10px;font-size:10.5px;min-height:36px}
  .famitem{padding:9px 11px;min-height:40px}
  .gloss{font-size:12.5px}
  #aboutBtn{padding:8px 11px;min-height:34px}
}

/* Short screens (landscape phones, small handsets): the header must not take
   half the viewport. Trim the informational line and tighten the search row. */
@media (max-width:820px) and (max-height:700px){
  #meta{display:none}
  #q{padding-top:10px;padding-bottom:10px}
  #helpToggle{margin-top:8px;padding:9px 12px}
  label.tg,select{min-height:38px}
  #msort{padding:6px 14px}
  #msort select,#dirBtn{min-height:36px}
}

/* Very small phones: drop the metric strip to essentials. */
@media (max-width:360px){
  .m-meta .m-units,.m-meta .m-sub{display:none}
  .glyph{font-size:26px}
  .c-emoji{flex:0 0 38px}
}

/* Coarse pointers get real tap targets regardless of width. */
@media (pointer:coarse){
  .copy,.kw,.fieldchip,.famitem,#dirBtn{min-height:40px}
}

@media (prefers-reduced-motion:reduce){
  #detail,#scrim{transition:none}
}
</style>
</head>
<body>

<div id="shell">
<header>
  <div class="brandrow">
    <h1>🦖 Emojisaurus.me - Emoji <span class="v">17.0</span> Explorer</h1>
    <div id="meta"></div>
    <a id="aboutBtn" href="{{aboutUrl}}">About</a>
  </div>

  <div class="searchrow">
    <div class="qwrap">
      <span class="qicon">⌕</span>
      <input id="q" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search names, keywords, slang senses — or try bytes:>25, alt:lying, v:17, cp:1F600, paste an emoji">
      <span class="slash">/</span>
    </div>
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="collapse" checked> collapse skin tones</label>
      <label class="tg"><input type="checkbox" id="explicit"> explicit senses</label>
      <select id="statusSel" title="Qualification status">
        <option value="fully-qualified">fully-qualified</option>
        <option value="minimally-qualified">minimally-qualified</option>
        <option value="unqualified">unqualified</option>
        <option value="component">component</option>
        <option value="all">all statuses</option>
      </select>
    </div>
  </div>

  <button id="helpToggle" aria-expanded="false" aria-controls="queryhelp">Query syntax &amp; examples</button>
  <div id="queryhelp">
    <div id="fieldref"></div>
    <div id="examples"></div>
  </div>
</header>

<main>
  <div id="left">
    <div id="status"></div>
    <div class="thead">
      <div data-sort="relevance" title="Reset to relevance order">#</div>
      <div data-sort="emoji">em</div>
      <div data-sort="name">name</div>
      <div data-sort="group">subgroup</div>
      <div data-sort="cps" title="Number of Unicode code points">cps</div>
      <div data-sort="bytes" title="UTF-8 encoded size in bytes">utf-8 b</div>
      <div data-sort="units" title="UTF-16 code units (JS string length)">u16</div>
      <div data-sort="version">ver</div>
      <div>code points</div>
    </div>
    <div id="msort">
      <label for="sortSel">sort</label>
      <select id="sortSel">
        <option value="relevance">relevance</option>
        <option value="name">name</option>
        <option value="group">subgroup</option>
        <option value="bytes">UTF-8 bytes</option>
        <option value="cps">code points</option>
        <option value="units">UTF-16 units</option>
        <option value="version">version</option>
      </select>
      <button id="dirBtn" aria-label="Toggle sort direction">↑</button>
    </div>
    <div id="viewport"><div id="spacer"><div id="rows"></div></div></div>
  </div>
  <aside id="detail" aria-label="Emoji detail">
    <button id="sheetClose" aria-label="Close detail">✕</button>
    <div id="detailBody"></div>
  </aside>
</main>
<div id="scrim" hidden></div>
</div>

<!--APP-->
</body>
</html>
